<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Biblioteca pessoal e pedagógica de Lucas HR">
    <title>Biblioteca — Lucas HR</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="hero">
      <nav class="nav" aria-label="Navegação principal">
        <a class="brand" href="/">📚 Biblioteca</a>
        <a class="public-link" href="https://github.com/LucasHRAlmeida" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
      <div class="hero-content">
        <p class="eyebrow">Arquivo pessoal · FMRP-USP</p>
        <h1>Um mapa para tudo<br><em>que estou construindo.</em></h1>
        <p class="intro">Uma biblioteca viva que organiza minha atuação como médico, educador e cidadão.</p>
        <div class="hero-meta">
          <span>6 estantes</span><span>·</span><span>17 prateleiras</span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="toolbar" aria-label="Filtros da biblioteca">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Buscar na biblioteca..." autocomplete="off">
        </label>
        <div class="filters" role="group" aria-label="Filtrar por status">
          <button class="filter active" data-filter="all">Tudo</button>
          <button class="filter" data-filter="live">🟢 No ar</button>
          <button class="filter" data-filter="building">🟡 Em construção</button>
          <button class="filter" data-filter="planned">🔵 Planejado</button>
        </div>
      </section>

      <section id="library" class="library" aria-live="polite"></section>
      <p id="empty" class="empty" hidden>Nenhum item encontrado. Tente outro termo.</p>
    </main>

    <footer>
      <span>Dr. Lucas HR</span>
      <span>Biblioteca privada · <a href="https://github.com/LucasHRAlmeida/OneDrive" target="_blank" rel="noreferrer">ver repositório ↗</a></span>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
